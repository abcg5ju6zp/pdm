rubrics:
  - id: 1
    type: f2p
    text: "项目维护者在同一 PDM 进程中切换私有包索引或更新凭据后再次解析依赖时,1,f2p,索引和凭据切换触发缓存边界变化"
  - id: 2
    type: f2p
    text: "HTTP 会话缓存可能复用切换前的响应,2,f2p,不匹配的旧响应不会被新配置复用"
  - id: 3
    type: f2p
    text: "会话缓存按索引身份和认证范围隔离,3,f2p,不同索引和认证范围使用隔离缓存"
  - id: 4
    type: f2p
    text: "配置变化后不复用不匹配的响应,4,f2p,配置变化立即形成新的可观察缓存选择"
  - id: 5
    type: f2p
    text: "认证失败、网络中断或进程重启时保留可安全复用的旧缓存但不泄露给新索引,5,f2p,失败恢复保留安全旧值且无跨索引泄露"
  - id: 6
    type: f2p
    text: "公开 PyPI、额外索引、离线缓存,6,p2p,这些已有来源模式继续工作"
  - id: 7
    type: f2p
    text: "现有 resolver/install 行为继续兼容,7,p2p,解析和安装流程不回归"
  - id: 8
    type: p2p
    text: "旧索引的 401、包元数据或下载结果带到新配置,8,f2p,新配置不会看到旧索引的错误或内容"
